
services:
###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "3306:3306"
    # Le Symfony CLI exposerait sinon un DATABASE_URL en root:<MARIADB_PASSWORD> (il ne lit
    # pas MARIADB_USER) qui écrase celui de .env : on garde celui de .env.
    labels:
      com.symfony.server.service-ignore: true
###< doctrine/doctrine-bundle ###

###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###
