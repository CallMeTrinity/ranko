# Documentation on how to configure the bundle can be found at: https://symfony.com/doc/current/bundles/LiipImagineBundle/basic-usage.html
#
# Les images sources vivent dans var/media (copies locales, voir App\Media\ImageStore).
# Chaque variante est générée à la première demande dans public/media/cache, puis servie
# par Apache comme un fichier statique, avec un cache navigateur d'un an (public/.htaccess).
#
# Attention : le chemin d'une variante ne dépend que du nom du filtre et de la source.
# Modifier un filtre existant ne change donc pas ses URLs, et les navigateurs garderaient
# l'ancienne version un an : créer un filtre au nom différent à la place.
liip_imagine:
    # valid drivers options include "gd" or "gmagick" or "imagick"
    driver: "gd"

    twig:
        mode: lazy

    loaders:
        default:
            filesystem:
                data_root: '%app.media_dir%'

    default_filter_set_settings:
        jpeg_quality: 80

    # Carrés recadrés, pour les pochettes. Les largeurs alimentent le srcset de
    # catalog/_cover.html.twig : le navigateur prend la plus petite qui suffit.
    filter_sets:
        square_128:
            filters:
                thumbnail: { size: [128, 128], mode: outbound }
                interlace: { mode: line }
        square_256:
            filters:
                thumbnail: { size: [256, 256], mode: outbound }
                interlace: { mode: line }
        square_512:
            filters:
                thumbnail: { size: [512, 512], mode: outbound }
                interlace: { mode: line }
        square_1024:
            filters:
                thumbnail: { size: [1024, 1024], mode: outbound }
                interlace: { mode: line }

when@test:
    liip_imagine:
        resolvers:
            default:
                web_path:
                    web_root: '%kernel.cache_dir%/public'
